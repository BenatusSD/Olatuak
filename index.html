<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olatuak</title>
<meta name="theme-color" content="#0E1B26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EAF0F4; --surface:#FFFFFF; --line:#D3DEE6; --text:#0E1B26; --muted:#4A6070;
  --accent:#E8C48A; --on-accent:#0E1B26; --focus:#1F6FB2; --chip-on:#0E1B26; --chip-on-text:#FFFFFF;
  --red:#D9443C; --orange:#E57A2E; --yellow:#D9B53A; --green:#2FA572; --empty:#C5D2DC;
  --sea:#D6E8F3; --sea-band:#B3D5EA; --coast:#C49A55;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1B26; --surface:#16293A; --line:#22394D; --text:#EAF1F5; --muted:#9DB2C2;
    --focus:#E8C48A; --chip-on:#EAF1F5; --chip-on-text:#0E1B26;
    --red:#E5534B; --orange:#F0883E; --yellow:#E5C54A; --green:#4CC38A; --empty:#2C4458;
    --sea:#173248; --sea-band:#1F4462; --coast:#E8C48A;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1B26; --surface:#16293A; --line:#22394D; --text:#EAF1F5; --muted:#9DB2C2;
  --focus:#E8C48A; --chip-on:#EAF1F5; --chip-on-text:#0E1B26;
  --red:#E5534B; --orange:#F0883E; --yellow:#E5C54A; --green:#4CC38A; --empty:#2C4458;
  --sea:#173248; --sea-band:#1F4462; --coast:#E8C48A;
}
html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
*,*::before,*::after{ box-sizing: border-box; }
body{ margin:0; background:var(--bg); color:var(--text); font-family: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button{ font: inherit; color: inherit; }
:focus-visible{ outline: 3px solid var(--focus); outline-offset: 2px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.app{ max-width: 480px; margin: 0 auto; padding: 16px 20px 32px; display:flex; flex-direction:column; gap:18px; }

.bar1{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.views{ display:flex; gap:8px; }
.iconbtn{ width:48px; height:48px; border-radius:14px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
.iconbtn[aria-pressed="true"]{ background:var(--chip-on); color:var(--chip-on-text); border-color:var(--chip-on); }
.seg{ display:flex; border:1px solid var(--line); border-radius:24px; overflow:hidden; background:var(--surface); }
.seg button{ min-width:48px; min-height:46px; padding:0 12px; border:0; background:transparent; color:var(--muted); font-weight:700; font-size:14px; cursor:pointer; }
.seg button[aria-pressed="true"]{ background:var(--chip-on); color:var(--chip-on-text); }
.bar2{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:10px; }
.bar2 h1{ margin:0; font-size:34px; line-height:1.1; font-weight:800; letter-spacing:-0.5px; }
.bar2 p{ margin:4px 0 0; font-size:14px; color:var(--muted); }
.star{ width:48px; height:48px; border-radius:24px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; flex-shrink:0; }

.card{ background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:22px; display:flex; flex-direction:column; gap:16px; }
.hero-row{ display:flex; align-items:center; gap:18px; }
.light{ width:76px; height:76px; border-radius:50%; flex-shrink:0; }
.kicker{ font-size:14px; font-weight:600; color:var(--muted); margin:0; }
.level{ font-size:30px; font-weight:800; line-height:1.1; }
.summary{ margin:0; font-size:16px; line-height:1.5; }
.now{ margin-left:auto; min-height:44px; padding:0 18px; border-radius:22px; border:0; background:var(--chip-on); color:var(--chip-on-text); font-weight:700; font-size:15px; cursor:pointer; flex-shrink:0; }

details{ border-top:1px solid var(--line); padding-top:6px; }
summary{ list-style:none; cursor:pointer; min-height:44px; display:flex; align-items:center; justify-content:space-between; font-weight:700; font-size:15px; }
summary::-webkit-details-marker{ display:none; }
summary svg{ transition: transform .2s ease; }
details[open] summary svg{ transform: rotate(180deg); }
.rows{ display:flex; flex-direction:column; gap:10px; padding:6px 0 4px; }
.row{ display:grid; grid-template-columns: 74px minmax(0,1fr) auto; gap:10px; align-items:baseline; font-size:15px; }
.row .k{ color:var(--muted); }
.row .pts{ font-weight:800; font-variant-numeric: tabular-nums; }
.row.total{ border-top:1px dashed var(--line); padding-top:10px; font-weight:700; }
.exc{ margin:6px 0 4px; font-size:15px; line-height:1.5; }

.grid{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; }
.tile{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:4px; }
.tile > span:first-of-type{ font-size:13px; color:var(--muted); }
.tile > span:last-of-type{ font-size:24px; font-weight:800; }
.tsub{ font-size:13px; color:var(--muted); }
.tile.wide{ grid-column: 1 / -1; flex-direction:row; align-items:center; gap:14px; }
.wxicon{ flex-shrink:0; }
.wxmain{ display:flex; flex-direction:column; gap:2px; }
.wxmain .lbl{ font-size:13px; color:var(--muted); }
.wxmain .val{ font-size:24px; font-weight:800; }
.legend{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:8px; margin-top:8px; }
.lg{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:12px; border:1px solid var(--line); font-size:14px; }
.lg.on{ border-color:var(--text); font-weight:800; }
.lg .rng{ margin-left:auto; color:var(--muted); font-variant-numeric: tabular-nums; }
details .kicker{ margin-top:10px; }
.tidecell.tall{ min-height:70px; gap:2px; }
.tidecell .c3{ font-size:12px; display:flex; align-items:center; gap:3px; }
.tilebtn{ position:relative; text-align:left; cursor:pointer; }
.tilebtn[aria-expanded="true"]{ border-color:var(--text); }
.tchev{ position:absolute; top:14px; right:12px; color:var(--muted); transition: transform .2s ease; }
.tilebtn[aria-expanded="true"] .tchev{ transform: rotate(180deg); }
.panelhead{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.panelhead h2{ margin:0; font-size:18px; font-weight:800; }
.closebtn{ min-height:44px; padding:0 16px; border-radius:22px; border:1px solid var(--line); background:transparent; font-weight:700; cursor:pointer; }
.ext{ display:flex; flex-direction:column; gap:8px; }
.extrow{ display:flex; justify-content:space-between; gap:12px; font-size:15px; }
.extrow span:first-child{ font-weight:700; }
.tidegrid{ display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:6px; }
.tidecell{ min-height:48px; padding:4px; border:1px solid var(--line); border-radius:12px; background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; color:var(--muted); cursor:pointer; }
.tidecell b{ font-size:14px; font-weight:800; color:var(--text); }
.tidecell[aria-pressed="true"]{ background:var(--chip-on); border-color:var(--chip-on); color:var(--chip-on-text); }
.tidecell[aria-pressed="true"] b{ color:var(--chip-on-text); }
.tlabel{ font-family: Manrope, system-ui, sans-serif; font-size:12px; fill:var(--muted); }

.bars{ display:grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap:6px; align-items:end; }
.bar-col{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:8px; min-height:80px; padding:6px 0; border:0; border-radius:12px; background:transparent; cursor:pointer; }
.bar-col[aria-pressed="true"]{ background: color-mix(in srgb, var(--text) 10%, transparent); }
.bar-col[aria-pressed="true"] span{ color:var(--text); font-weight:800; }
.bar{ display:block; width:100%; max-width:34px; border-radius:8px; }
.bar-col span{ font-size:13px; color:var(--muted); font-variant-numeric: tabular-nums; }
.note{ margin:0; font-size:14px; color:var(--muted); line-height:1.45; }

.cam{ display:flex; align-items:center; justify-content:center; gap:10px; min-height:52px; border-radius:26px; background:var(--accent); color:var(--on-accent); font-size:17px; font-weight:700; text-decoration:none; }

.filters{ display:flex; flex-wrap:wrap; gap:8px; }
.fchip{ min-height:44px; padding:0 16px; border-radius:22px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:14px; cursor:pointer; }
.fchip[aria-pressed="true"]{ background:var(--chip-on); color:var(--chip-on-text); border-color:var(--chip-on); }
.orderrow{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.orderrow span{ font-size:14px; font-weight:600; color:var(--muted); }
.timebar{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 8px 8px 16px; border-radius:18px; background:var(--surface); border:1px solid var(--line); font-weight:700; font-size:15px; }

.list{ display:flex; flex-direction:column; gap:10px; }
.item{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:14px 16px; min-height:68px; border-radius:18px; border:1px solid var(--line); background:var(--surface); cursor:pointer; }
.item-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.item-name{ font-size:17px; font-weight:700; }
.item-sub{ font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-level{ font-size:14px; font-weight:700; flex-shrink:0; }
.dot{ width:14px; height:14px; border-radius:7px; flex-shrink:0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.dot.lg{ width:22px; height:22px; border-radius:11px; }
.empty{ margin:0; padding:20px; border-radius:18px; border:1px dashed var(--line); font-size:15px; line-height:1.5; color:var(--muted); }

.mapwrap{ overflow-x:auto; border-radius:22px; border:1px solid var(--line); background:var(--surface); -webkit-overflow-scrolling: touch; }
.mapwrap svg{ display:block; }
.mdot{ cursor:pointer; }
.mdot:focus{ outline:none; }
.mdot:focus-visible .ring{ stroke:var(--focus); stroke-width:3; opacity:1; }
.mlabel{ font-family: Manrope, system-ui, sans-serif; font-size:13px; font-weight:600; fill:var(--text); }
.mlabel.fav{ font-weight:800; }
.mregion{ font-family: Manrope, system-ui, sans-serif; font-size:14px; font-weight:700; fill:var(--muted); }

.banner{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:14px 16px; border-radius:16px; border:1px dashed var(--line); font-size:14px; line-height:1.45; color:var(--muted); }
.banner button{ min-height:44px; padding:0 16px; border-radius:22px; border:1px solid var(--line); background:var(--surface); font-weight:700; cursor:pointer; }
footer{ font-size:13px; color:var(--muted); line-height:1.5; }
footer a{ color:inherit; }
@media (prefers-reduced-motion: reduce){ summary svg{ transition:none; } }
</style>
</head>

  const h = x.h, p = x.p, ws = x.ws;

async function getJSON(url, tries = 3){
  for (let k = 1; ; k++){
    const r = await fetch(url);
    if (r.ok) return r.json();
    if (r.status >= 500 && k < tries){ await new Promise(res => setTimeout(res, 1500 * k)); continue; }
    throw new Error('HTTP ' + r.status + ' ' + new URL(url).host);
  }
}
const MARINE = 'https://marine-api.open-meteo.com/v1/marine';
const FORECAST = 'https://api.open-meteo.com/v1/forecast';
const MARINE_VARS = 'wave_height,wave_period,wave_direction,swell_wave_height,swell_wave_period,swell_wave_direction';
async function batch(base, vars, list, latList){
  const lat = (latList || list.map(b => b.lat)).join(',');
  const lon = list.map(b => b.lon).join(',');
  const extra = base === FORECAST ? '&wind_speed_unit=kmh' : '';
  const j = await getJSON(`${base}?latitude=${lat}&longitude=${lon}&hourly=${vars}&timezone=${encodeURIComponent(TZ)}&forecast_days=2${extra}`);
  return Array.isArray(j) ? j : [j];
}
const hasWaves = o => !!(o && o.hourly && o.hourly.wave_height && o.hourly.wave_height.some(v => v != null));
function mapBy(h, key){ if (!h || !h[key] || !h.time) return null; return new Map(h.time.map((t, j) => [t, h[key][j]])); }

  if (!H || !H.time) return [];
  const m = k => mapBy(W, k);
  const ws = m('wind_speed_10m'), wd = m('wind_direction_10m'), wg = m('wind_gusts_10m'), ta = m('temperature_2m'),
        rp = m('precipitation_probability'), wc = m('weather_code'), uv = m('uv_index'), dy = m('is_day');
  const sst = mapBy(SS, 'sea_surface_temperature'), tide = mapBy(L, 'sea_level_height_msl');
  const g = (mp, t) => mp ? (mp.get(t) ?? null) : null;
  return H.time.map((t, j) => ({
    t,
    h: at(H.swell_wave_height, j) ?? at(H.wave_height, j),
    p: at(H.swell_wave_period, j) ?? at(H.wave_period, j),
    d: at(H.swell_wave_direction, j) ?? at(H.wave_direction, j),
    ws: g(ws, t), wd: g(wd, t), wg: g(wg, t), ta: g(ta, t), rp: g(rp, t), wc: g(wc, t), uv: g(uv, t), dy: g(dy, t),
    sst: g(sst, t), tide: g(tide, t)

}
async function loadAll(){
  S.loading = true; render();
  try {
    const marine = await batch(MARINE, MARINE_VARS, BEACHES);
    if (marine.length !== BEACHES.length) throw new Error('Respuesta inesperada de Open-Meteo');
    const lat2 = BEACHES.map(b => b.lat);
    for (let pass = 0; pass < 2; pass++){
      const bad = BEACHES.map((b, k) => k).filter(k => !hasWaves(marine[k]));
      if (!bad.length) break;
      bad.forEach(k => lat2[k] = Math.round((lat2[k] + 0.04) * 1000) / 1000);
      const r = await batch(MARINE, MARINE_VARS, bad.map(k => BEACHES[k]), bad.map(k => lat2[k]));
      bad.forEach((k, n) => { if (hasWaves(r[n])) marine[k] = r[n]; });
    }
    const ex = await Promise.allSettled([
      batch(FORECAST, 'wind_speed_10m,wind_direction_10m,wind_gusts_10m,temperature_2m,precipitation_probability,weather_code,uv_index,is_day', BEACHES),
      batch(MARINE, 'sea_surface_temperature', BEACHES, lat2),
      batch(MARINE, 'sea_level_height_msl', BEACHES, lat2)
    ]);
    if (ex[0].status !== 'fulfilled') console.warn('Olatuak: viento no disponible', ex[0].reason);
    const pick = (r, k) => (r.status === 'fulfilled' && r.value[k] && r.value[k].hourly) ? r.value[k].hourly : null;
    const hours = {};
    BEACHES.forEach((b, k) => { hours[b.id] = buildHours(marine[k] && marine[k].hourly, pick(ex[0], k), pick(ex[1], k), pick(ex[2], k)); });
    const when = new Date().toISOString();
    S.data = { hours, source:'live', at:when };
    store.set('cache:all', { hours, at:when });
  } catch (e) {
    console.error('Olatuak:', e);
    const err = String((e && (e.name + ': ' + e.message)) || e);
    const c = store.get('cache:all', null);
    S.data = c ? { hours:c.hours, source:'cached', at:c.at, err } : { hours:demoAll(), source:'demo', at:new Date().toISOString(), err };
  }
  S.loading = false; render();
}

function swellView(t, hours, from, cur){
  const chart = lineChart(hours, from, cur, [{ get: x => x.h, stroke: 'var(--coast)', fill: true }], { label: t.swellT, fmt: v => fmt(v, 1) + ' m' });
  const cells = hourCells(hours, from, cur, x => x.h == null ? null : `<b>${fmt(x.h, 1)} m</b><span class="c3">${fmt(x.p, 0)} s ${dirArrow(x.d)}</span>`);
  return panelWrap(t.swellT, `${chart}<h3 class="kicker">${t.tideHourly}</h3>${cells}<p class="note">${t.swellNote}</p>`, t);
}
function windView(t, hours, from, cur){
  const chart = lineChart(hours, from, cur, [
    { get: x => x.ws, stroke: 'var(--text)' },
    { get: x => x.wg, stroke: 'var(--muted)', dash: '4 4', width: 2 }
  ], { label: t.wind, fmt: v => fmt(v, 0) + ' km/h', min: 0 });
  let mg = null;
  for (let k = 0; k <= 24 && from + k < hours.length; k++){ const g = hours[from + k].wg; if (g != null && (mg == null || g > mg)) mg = g; }
  const cells = hourCells(hours, from, cur, x => {
    if (x.ws == null) return null;
    return `<b>${fmt(x.ws, 0)} km/h</b><span class="c3">${dirArrow(x.wd, isOff(x) ? 'var(--green)' : '')}${x.wd != null ? t.abbr[dirIdx(x.wd)] : ''}${x.wg != null ? ' · ' + fmt(x.wg, 0) : ''}</span>`;
  });
  return panelWrap(t.wind, `${chart}<p class="note">${t.windLegend}</p>
    ${mg != null ? `<div class="extrow"><span>${t.maxGust}</span><span>${fmt(mg, 0)} km/h</span></div>` : ''}
    <h3 class="kicker">${t.tideHourly}</h3>${cells}<p class="note">${t.windNote}</p>`, t);
}
function tideTime(x, offMin, t){
  const today = nowKey().slice(0, 10), date = x.t.slice(0, 10);
  const total = parseInt(x.t.slice(11, 13), 10) * 60 + offMin;
  const wrapped = ((total % 1440) + 1440) % 1440;
  const hh = String(Math.floor(wrapped / 60)).padStart(2, '0'), mm = String(wrapped % 60).padStart(2, '0');
  const tomorrow = (date !== today && total >= 0) || (date === today && total >= 1440);
  return (tomorrow ? t.tomorrow + ' ' : '') + hh + ':' + mm;
}
function tideView(t, hours, from, cur){
  const ext = [];
  for (let j = Math.max(1, from); j < Math.min(hours.length - 1, from + 36); j++){
    const a = hours[j - 1].tide, b = hours[j].tide, c = hours[j + 1].tide;
    if (a == null || b == null || c == null) continue;
    const hi = b >= a && b > c, lo = b <= a && b < c;
    if (!hi && !lo) continue;
    const den = a - 2 * b + c, off = den !== 0 ? 0.5 * (a - c) / den : 0;
    ext.push({ hi, x: hours[j], off: Math.round(off * 60), v: b - 0.25 * (a - c) * off });
  }
  const chart = lineChart(hours, from, cur, [{ get: x => x.tide, stroke: 'var(--coast)', fill: true }], { label: t.tides, fmt: v => fmt(v, 1) + ' m' });
  const rows = ext.slice(0, 4).map(e => `<div class="extrow"><span>${e.hi ? t.high : t.low}</span><span>${tideTime(e.x, e.off, t)} · ${fmt(e.v, 1)} m</span></div>`).join('');
  const cells = hourCells(hours, from, cur, (x, nx) => {
    if (x.tide == null) return null;
    const arrow = nx && nx.tide != null ? (nx.tide >= x.tide ? '↑' : '↓') : '';
    return `<b>${fmt(x.tide, 1)} m</b><span class="c3">${arrow}</span>`;
  });
  return panelWrap(t.tides, `${chart}${rows ? `<div class="ext">${rows}</div>` : ''}<h3 class="kicker">${t.tideHourly}</h3>${cells}<p class="note">${t.tideNote}</p>`, t);
}
function weatherView(t, hours, from, cur){
  const chart = lineChart(hours, from, cur, [{ get: x => x.ta, stroke: 'var(--orange)' }], { label: t.weather, fmt: v => fmt(v, 0) + ' °C' });
  let uv = null;
  for (let k = 0; k <= 24 && from + k < hours.length; k++){ const u = hours[from + k].uv; if (u != null && (uv == null || u > uv)) uv = u; }
  const cells = hourCells(hours, from, cur, x => (x.ta == null && x.wc == null) ? null
    : `${wxIcon(x.wc, x.dy, 20)}<b>${fmt(x.ta, 0)}°</b><span class="c3">${x.rp != null ? fmt(x.rp, 0) + ' %' : ''}</span>`);
  return panelWrap(t.weather, `${chart}${uv != null ? `<div class="extrow"><span>${t.uvMax}</span><span>${fmt(uv, 0)}</span></div>` : ''}
    <h3 class="kicker">${t.tideHourly}</h3>${cells}<p class="note">${t.weatherNote}</p>`, t);
}

function beachView(t){
  const b = byId(S.sel);
  const hours = hoursOf(S.sel);
  const i0 = idxNow(hours), i = idxFor(hours), cur = i >= 0 ? hours[i] : null, s = score(cur);
  const label = levelLabel(s, t), color = levelColor(s);

  let summary = t.noData;
  if (cur && cur.h != null){
    summary = t.swellSentence(cur.d != null ? t.dirFrom[dirIdx(cur.d)] : '', fmt(cur.h, 1), fmt(cur.p, 0));
    if (cur.ws != null){
      const f = cur.ws < 10 ? 0 : cur.ws <= 20 ? 1 : 2;
      summary += ' ' + t.windSentence(t.force[f], cur.wd != null ? t.dirFrom[dirIdx(cur.wd)] : '', isOff(cur));
    }
  }
  const windTxt = cur && cur.ws != null ? fmt(cur.ws, 0) + ' km/h ' + (cur.wd != null ? t.abbr[dirIdx(cur.wd)] : '') : '—';

  let breakdown = '';
  if (s && s.exc) breakdown = `<p class="exc">${s.exc === 'flat' ? t.excFlat : t.excBig}</p>`;
  else if (s) breakdown = `<div class="rows">
      <div class="row"><span class="k">${t.hRow}</span><span>${fmt(cur.h,1)} m · ${t.hReason[s.hr]}</span><span class="pts">${s.hp}/5</span></div>
      <div class="row"><span class="k">${t.pRow}</span><span>${fmt(cur.p,0)} s · ${t.pReason[s.pr]}</span><span class="pts">${s.pp}/5</span></div>
      <div class="row"><span class="k">${t.wRow}</span><span>${windTxt} · ${t.wReason[s.wr]}</span><span class="pts">${s.wp}/5</span></div>
      <div class="row total"><span class="k">${t.total}</span><span>${label}</span><span class="pts">${s.total}/15</span></div>
    </div>`;
  const legend = s ? `<p class="kicker">${t.scale}</p><div class="legend">${[3, 2, 1, 0].map(l =>
    `<div class="lg${s.level === l ? ' on' : ''}"><span class="dot" style="background:${COLORS[l]}"></span><span>${t.levels[l]}</span><span class="rng">${RANGES[l]}</span></div>`).join('')}</div>` : '';

  let tideTxt = '—';
  if (cur && cur.tide != null && hours[i + 1] && hours[i + 1].tide != null) tideTxt = hours[i + 1].tide >= cur.tide ? t.rising : t.falling;

  const has = {
    swell: hours.some(x => x.h != null),
    wind: hours.some(x => x.ws != null),
    tide: hours.some(x => x.tide != null),
    weather: hours.some(x => x.ta != null || x.wc != null)
  };
  const tile = (panel, lbl, val, sub) => has[panel]
    ? `<button type="button" class="tile tilebtn" data-action="panel" data-panel="${panel}" aria-expanded="${S.panel === panel}">${I.chevSm}<span>${lbl}</span><span>${val}</span>${sub ? `<small class="tsub">${sub}</small>` : ''}</button>`
    : `<div class="tile"><span>${lbl}</span><span>${val}</span></div>`;

  const wxGroup = cur ? WX_GROUP(cur.wc) : null;
  const wxSub = [wxGroup ? t.wx[wxGroup] : '', cur && cur.rp != null ? `${t.rain} ${fmt(cur.rp, 0)} %` : '', cur && cur.uv != null ? `UV ${fmt(cur.uv, 0)}` : ''].filter(Boolean).join(' · ');
  const weatherTile = has.weather
    ? `<button type="button" class="tile tilebtn wide" data-action="panel" data-panel="weather" aria-expanded="${S.panel === 'weather'}">${I.chevSm}${wxIcon(cur && cur.wc, cur && cur.dy, 40)}<div class="wxmain"><span class="lbl">${t.weather}</span><span class="val">${fmt(cur && cur.ta, 0)} °C</span>${wxSub ? `<small class="tsub">${wxSub}</small>` : ''}</div></button>`
    : '';

  const from = Math.max(0, i0);
  let panel = '';
  if (S.panel && has[S.panel]){
    panel = S.panel === 'swell' ? swellView(t, hours, from, cur)
      : S.panel === 'wind' ? windView(t, hours, from, cur)
      : S.panel === 'tide' ? tideView(t, hours, from, cur)
      : weatherView(t, hours, from, cur);
  }

  const steps = [];
  for (let k = 0; k < 7; k++){ const x = hours[i0 + k * 2]; if (x) steps.push(x); }
  let bestLvl = -1, bestT = null;
  const bars = steps.map(x => {
    const sc = score(x), lv = sc ? sc.level : -1;
    if (lv > bestLvl){ bestLvl = lv; bestT = x.t.slice(11, 16); }
    return `<button type="button" class="bar-col" data-action="hour" data-t="${x.t}" aria-pressed="${!!cur && x.t === cur.t}"><span class="bar" style="height:${lv < 0 ? 6 : BAR_H[lv]}px;background:${lv < 0 ? 'var(--empty)' : COLORS[lv]}"></span><span>${x.t.slice(11,13)}<span class="sr"> h: ${levelLabel(sc, t)}</span></span></button>`;
  }).join('');

  const notNow = cur && i !== i0;
  return `
    <section class="card" aria-label="${t.surfNow}">
      <div class="hero-row">
        <div class="light" style="background:${color};box-shadow:0 0 0 6px color-mix(in srgb, ${color} 24%, transparent)"></div>
        <div><p class="kicker">${notNow ? t.surfAt(cur.t.slice(11,16)) : t.surfNow}</p><div class="level">${label}</div></div>
        ${notNow ? `<button type="button" class="now" data-action="now">${t.now}</button>` : ''}
      </div>
      <p class="summary">${summary}</p>
      ${s ? `<details><summary>${t.why}${I.chev}</summary>${breakdown}${legend}</details>` : ''}
    </section>
    <section class="grid">
      ${tile('swell', t.height, fmt(cur && cur.h, 1) + ' m')}
      ${tile('swell', t.period, fmt(cur && cur.p, 0) + ' s')}
      ${tile('swell', t.swellDir, cur && cur.d != null ? t.abbr[dirIdx(cur.d)] : '—')}
      ${tile('wind', t.wind, windTxt, cur && cur.wg != null ? `${t.gusts} ${fmt(cur.wg, 0)} km/h` : '')}
      ${tile('tide', t.tide, tideTxt)}
      <div class="tile"><span>${t.water}</span><span>${cur && cur.sst != null ? fmt(cur.sst,0) + ' °C' : '—'}</span></div>
      ${weatherTile}
    </section>
    ${panel}
    <section class="card">
      <h2 class="kicker">${t.next}</h2>
      <div class="bars">${bars}</div>
      <p class="note">${bestLvl > 0 ? t.bestHour(bestT) : t.none} ${t.barsNote}</p>
    </section>
    ${b.cam ? `<a class="cam" href="${b.cam}" target="_blank" rel="noopener">${I.cam}${t.cam}</a>` : ''}`;
}

/* ---------- Render: lista ---------- */
function listView(t){
  let items = BEACHES.map((b, n) => ({ b, n, x: curOf(b.id) })).filter(o => matchesFilter(o.b));
  items.forEach(o => o.s = score(o.x));
  if (S.order === 'best'){
    const rank = s => s ? s.level * 10 + Math.max(0, s.total) : -1;
    items.sort((a, c) => rank(c.s) - rank(a.s) || a.n - c.n);
  }
  let body;
  if (!items.length) body = `<p class="empty">${S.filter === 'fav' ? t.noFavs : '—'}</p>`;
  else body = `<div class="list">${items.map(({ b, x, s }) => {
    const fav = S.favs.includes(b.id);
    const sub = x && x.h != null
      ? `${b.region} · ${fmt(x.h,1)} m · ${fmt(x.p,0)} s${x.ws != null ? ' · ' + fmt(x.ws,0) + ' km/h ' + (x.wd != null ? t.abbr[dirIdx(x.wd)] : '') : ''}`
      : b.region;
    return `<button type="button" class="item" data-action="open" data-id="${b.id}">
      <span class="dot lg" style="background:${levelColor(s)}"></span>
      <span class="item-main"><span class="item-name">${fav ? '★ ' : ''}${b.name[S.lang]}</span><span class="item-sub">${sub}</span></span>
      <span class="item-level">${levelLabel(s, t)}</span>
    </button>`;
  }).join('')}</div>`;
  return `
    ${filters(t)}
    <div class="orderrow"><span>${t.order}</span>
      <div class="seg" role="group" aria-label="${t.order}">
        <button type="button" data-action="order" data-order="coast" aria-pressed="${S.order === 'coast'}">${t.coast}</button>
        <button type="button" data-action="order" data-order="best" aria-pressed="${S.order === 'best'}">${t.best}</button>
      </div>
    </div>
    ${timebar(t)}
    ${body}`;
}

/* ---------- Render: mapa ---------- */
const COAST = [[0,120],[130,100],[250,82],[318,86],[340,122],[362,92],[410,96],[480,130],[560,176],[620,200],[690,212],[760,210],[810,204],[880,182],[930,194],[975,188],[1010,165],[1045,130],[1066,95],[1080,60],[1090,20],[1094,0]];
function smoothPath(p){
  let d = `M${p[0][0]},${p[0][1]}`;
  for (let i = 0; i < p.length - 1; i++){
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
const COAST_D = smoothPath(COAST);
const SEA_D = 'M0,0 L' + COAST_D.slice(1) + ' L1094,0 Z';
function mapView(t){
  const dots = BEACHES.map(b => {
    const s = score(curOf(b.id)), fav = S.favs.includes(b.id), on = matchesFilter(b), isSel = b.id === S.sel;
    const name = (fav ? '★ ' : '') + b.name[S.lang];
    const lapurdi = b.region === 'Lapurdi';
    const lx = lapurdi ? b.mx + 17 : b.mx - 12, ly = lapurdi ? b.my + 5 : b.my + 15;
    const text = lapurdi
      ? `<text class="mlabel${fav ? ' fav' : ''}" x="${lx}" y="${ly}">${name}</text>`
      : `<text class="mlabel${fav ? ' fav' : ''}" x="${lx}" y="${ly}" text-anchor="end" transform="rotate(-40 ${lx} ${ly})">${name}</text>`;
    return `<g class="mdot" role="button" tabindex="${on ? 0 : -1}" aria-label="${b.name[S.lang]}: ${levelLabel(s, t)}" data-action="open" data-id="${b.id}" style="opacity:${on ? 1 : 0.22}">
      <circle cx="${b.mx}" cy="${b.my}" r="20" fill="transparent"/>
      <circle class="ring" cx="${b.mx}" cy="${b.my}" r="15" fill="none" stroke="var(--text)" stroke-width="2" opacity="${isSel ? 1 : 0}"/>
      <circle cx="${b.mx}" cy="${b.my}" r="9" fill="${levelColor(s)}" stroke="var(--surface)" stroke-width="2.5"/>
      ${text}
    </g>`;
  }).join('');
  return `
    ${filters(t)}
    ${timebar(t)}
    <div class="mapwrap" id="mapwrap">
      <svg width="1180" height="290" viewBox="0 0 1180 290" role="group" aria-label="${t.viewMap}">
        <path d="${SEA_D}" fill="var(--sea)"/>
        <path d="${COAST_D}" fill="none" stroke="var(--sea-band)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="${COAST_D}" fill="none" stroke="var(--coast)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        <text class="mregion" x="170" y="40">Bizkaia</text>
        <text class="mregion" x="680" y="135">Gipuzkoa</text>
        <text class="mregion" x="900" y="70">Lapurdi</text>
        ${dots}
      </svg>
    </div>
    <p class="note">${t.swipe}</p>`;
}

/* ---------- Render principal ---------- */
function render(){
  const t = T[S.lang];
  if (S.selT && S.selT < nowKey()) S.selT = null;
  document.documentElement.lang = S.lang;
  document.title = (S.view === 'beach' ? byId(S.sel).name[S.lang] : t.beaches) + ' · Olatuak';
  const wrap = document.getElementById('mapwrap');
  const keepScroll = wrap ? wrap.scrollLeft : null;

  let body;
  if (S.loading && !S.data) body = `<section class="card"><p class="summary">${t.loading}</p></section>`;
  else if (S.view === 'list') body = listView(t);
  else if (S.view === 'map') body = mapView(t);
  else body = beachView(t);

  document.getElementById('app').innerHTML = `
    ${header(t)}
    ${banner(t)}
    ${body}
    <footer>${t.footer.replace('Open-Meteo', '<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>')}</footer>`;

  const nw = document.getElementById('mapwrap');
  if (nw){
    if (S.pendingScroll != null){ nw.scrollLeft = Math.max(0, S.pendingScroll - nw.clientWidth / 2); S.pendingScroll = null; }
    else if (keepScroll != null) nw.scrollLeft = keepScroll;
  }
  if (S.panelScroll){
    S.panelScroll = false;
    const tp = document.getElementById('panel');
    if (tp && tp.scrollIntoView) tp.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' });
  }
}
function scrollTargetFor(filter){
  if (REGION_X[filter]) return REGION_X[filter];
  if (filter === 'fav'){ const f = BEACHES.find(b => S.favs.includes(b.id)); if (f) return f.mx; }
  return byId(S.sel).mx;
}

/* ---------- Eventos ---------- */
const app = document.getElementById('app');
app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'lang'){ S.lang = el.dataset.lang; store.set('lang', S.lang); }
  if (a === 'view'){
    const v = el.dataset.view;
    S.view = S.view === v ? 'beach' : v;
    if (S.view === 'map') S.pendingScroll = byId(S.sel).mx;
    window.scrollTo(0, 0);
  }
  if (a === 'filter'){
    S.filter = el.dataset.filter; store.set('filter', S.filter);
    if (S.view === 'map') S.pendingScroll = scrollTargetFor(S.filter);
  }
  if (a === 'order'){ S.order = el.dataset.order; store.set('order', S.order); }
  if (a === 'open'){ S.sel = el.dataset.id; store.set('sel', S.sel); S.view = 'beach'; window.scrollTo(0, 0); }
  if (a === 'star'){
    S.favs = S.favs.includes(S.sel) ? S.favs.filter(x => x !== S.sel) : [...S.favs, S.sel];
    S.favs.sort((x, y) => BEACHES.findIndex(b => b.id === x) - BEACHES.findIndex(b => b.id === y));
    store.set('favs', S.favs);
  }
  if (a === 'hour'){ const i0 = idxNow(hoursOf(S.sel)); const nowT = i0 >= 0 ? hoursOf(S.sel)[i0].t : null; S.selT = el.dataset.t === nowT ? null : el.dataset.t; }
  if (a === 'panel'){ const p = el.dataset.panel; S.panel = S.panel === p ? null : p; S.panelScroll = !!S.panel; }
  if (a === 'now') S.selT = null;
  if (a === 'retry'){ loadAll(); return; }
  render();
});
app.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[role="button"]')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles:true })); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S.data) return;
  if (Date.now() - new Date(S.data.at).getTime() > 30 * 60 * 1000) loadAll();
});

/* ---------- Arranque ---------- */
render();
loadAll();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
